DOCUMENTATION:
  name: "walk"
  version_added: "0.4.0"
  short_description: >-
    Traverse an object using a sequence of keys and return the item mapped by
    the last key if found, else *default*.
  description:
    - >-
      Traverse a nested mapping or object using the provided sequence of keys.
    - >-
      Return the item mapped by the last key if found, or *default* if the last
      key does not match or if *keys* is empty.
    - "If an intermediate key along the path is missing, an error is raised."
    - >-
      If no default is provided and the last key does not match, ``None`` is
      returned.
  positional: "_input, keys, default"
  options:
    _input:
      description: "The root object or mapping to traverse."
      type: "dict"
      required: true
    keys:
      description: "The sequence of keys defining the traversal path."
      type: "list"
      elements: "raw"
      required: true
    default:
      description: >-
        A value to be returned when the last key is not found, or when *keys* is empty.
      type: "raw"

EXAMPLES: |
  # value => 'deep_value'
  value: "{{ {'a': {'b': {'c': 'deep_value'}}} | walk(['a', 'b', 'c']) }}"
  # value => 'fallback'
  value: "{{ {'a': {'b': {}}} | walk(['a', 'b', 'c'], default='fallback') }}"
  # value => 'fallback'
  value: "{{ {'a': 1} | walk([], default='fallback') }}"

RETURN:
  _value:
    description: "The value mapped by the last key, or *default*."
    type: "raw"
